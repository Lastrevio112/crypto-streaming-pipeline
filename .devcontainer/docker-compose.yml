services:
  app:
    container_name: crypto-app
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
    command: sleep infinity
    environment:
      - PYTHONPATH=/workspace
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    shm_size: '2gb'
    env_file:
      - ../.env 
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      clickhouse:
        condition: service_started
      jobmanager:          
        condition: service_started
    networks:
      - crypto-network
    
  kafka:
    container_name: crypto-kafka
    image: apache/kafka:4.3.0-rc0
    platform: linux/arm64
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 96 # Retain logs for 4 days
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
    - kafka-data:/var/lib/kafka
    restart: unless-stopped
    networks:
      - crypto-network
  
  schema-registry:
    container_name: crypto-schema-registry
    image: confluentinc/cp-schema-registry:7.6.0
    platform: linux/arm64
    ports: 
     - "8085:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - crypto-network
    
  clickhouse:
    container_name: crypto-clickhouse
    image: clickhouse/clickhouse-server:25.10-distroless
    platform: linux/arm64
    ports:
      - "8123:8123"
      - "9000:9000"
    env_file:
      - ../.env.clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server/
      - type: bind
        source: ../src/clickhouse/config.d
        target: /etc/clickhouse-server/config.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - crypto-network

  jobmanager:
    container_name: crypto-jobmanager
    user: root    # So that it can create a checkpoint directory in every container rebuild
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.flink
    entrypoint: /opt/flink/bin/jobmanager.sh
    command: start-foreground
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
      PYTHONPATH: /workspace
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./flink-libs:/opt/flink/lib/extra   # mount a local folder with JARs
      - ..:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - crypto-network

  taskmanager:
    container_name: crypto-taskmanager
    user: root
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.flink
    entrypoint: /opt/flink/bin/taskmanager.sh
    command: start-foreground
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 10
        parallelism.default: 10
        taskmanager.memory.process.size: 7168m
        taskmanager.memory.managed.fraction: 0.40
        table.exec.source.idle-timeout: 1000
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - ./flink-libs:/opt/flink/lib/extra
      - ..:/workspace
    restart: unless-stopped
    networks:
      - crypto-network

  # This service starts the data generation each time the container is rebuilt by running our two producers
  kafka-producers-init:
    container_name: crypto-kafka-producers-init
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ..:/workspace
    environment:
      - PYTHONPATH=/workspace
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - PYTHONBUFFERED=1
    env_file:
      - ../.env
    command: >
      bash -c "
        python /workspace/src/kafka_producers/DS1/run_DS1_producer.py &
        python /workspace/src/kafka_producers/DS2/run_DS2_producer.py &
        wait
      "
    restart: unless-stopped   #If one producer crashes, the container exits and restart: unless-stopped brings it back up
    networks:
      - crypto-network

  # This service exists only to run the DDL and DML scripts that Flink relies on, since these do not persist between container rebuilds.
  flink-init:
    container_name: crypto-flink-init
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.flink
    depends_on:
      jobmanager:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      taskmanager:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
    volumes:
      - ..:/workspace
      - flink-checkpoints:/opt/flink/checkpoints
    # We hard-coded a wait period of 20 seconds for the taskmanager to register. Unfortunately there's no way to check whether the taskmanager service is healthy so we have to do it the 'ugly' way.
    command: >
      bash -c "
        echo 'Waiting for taskmanager to register...' &&
        sleep 20 &&
        bash /workspace/src/flink/run_flink_from_checkpoint.sh
      "
    restart: "no"
    networks:
      - crypto-network
  
  grafana:
    container_name: crypto-grafana
    image: grafana/grafana-enterprise
    environment:
      - GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - crypto-network

  fastapi:
    container_name: crypto-fastapi
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.fastapi
    environment:
      - PYTHONPATH=/workspace
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      - ../.env
    volumes:
      - ..:/workspace
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - crypto-network

  nginx:
    container_name: crypto-nginx
    image: nginx:alpine
    platform: linux/arm64
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/cache:/var/cache/nginx
      - ../certs:/etc/nginx/certs:ro        # my Let's Encrypt certs
      - ../frontend:/usr/share/nginx/html:ro # my static HTML/JS files
    depends_on:
      - fastapi
      - grafana
    restart: unless-stopped
    networks:
      - crypto-network

networks:
  crypto-network:
    driver: bridge

volumes:
  kafka-data:
  clickhouse-data:
  clickhouse-logs:
  clickhouse-config:
  clickhouse-users:
  flink-checkpoints:
  grafana-storage: