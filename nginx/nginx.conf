events {}

http {
    include       /etc/nginx/mime.types;

    # Cache zone: 50m for keys in memory, 250m max on disk 
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=grafana_cache:50m
                     max_size=250m
                     inactive=10s
                     use_temp_path=off;

    # Rate limiting: 30 req/s per IP, coarse DDoS protection 
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;

    server {
        listen 80;

        # Apply rate limit globally with a burst allowance of 60
        limit_req zone=global burst=60 nodelay;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000/;

            # --- Caching ---
            proxy_cache grafana_cache;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_valid any 2s;   # grafana refreshes once every 2 seconds
            proxy_ignore_headers Cache-Control;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            # Cache key: method + URI + query string + referer + body size
            # Body size differentiates POST payloads for different panels,
            # same trick as this article since we can't read POST body: https://makergeek.co.uk/caching-grafana-graphs-with-the-open-source-version/
            set $cache_key "$request_method$request_uri$http_referer$content_length";
            proxy_cache_key $cache_key;

            # Expose cache status for testing
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /ws/ {
            proxy_pass http://fastapi:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}