events {}

http {
    include       /etc/nginx/mime.types;

    # Trust Cloudflare IPs and extract real visitor IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # Cache zone: 50m for keys in memory, 250m max on disk 
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=grafana_cache:50m
                     max_size=250m
                     inactive=10s
                     use_temp_path=off;

    # Rate limiting: 30 req/s per IP, coarse DDoS protection 
    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name lastrevioprojects.org www.lastrevioprojects.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name lastrevioprojects.org www.lastrevioprojects.org;

        ssl_certificate     /etc/nginx/certs/lastrevioprojects.org.pem;
        ssl_certificate_key /etc/nginx/certs/lastrevioprojects.org.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Apply rate limit globally with a burst allowance of 60
        limit_req zone=global burst=20 nodelay;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;

            limit_req zone=global burst=60 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Cookie "";
            proxy_set_header Authorization "";

            # --- Caching ---
            proxy_cache grafana_cache;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_valid 200 206 2s;   # only cache successful responses for 2s which is grafana's refresh rate
            proxy_cache_valid any 0;        # don't cache anything else
            proxy_ignore_headers Cache-Control;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            # Cache key: method + URI + query string + referer + body size
            # Body size differentiates POST payloads for different panels,
            # same trick as this article since we can't read POST body: https://makergeek.co.uk/caching-grafana-graphs-with-the-open-source-version/
            set $cache_key "$request_method$request_uri$http_referer$content_length";
            proxy_cache_key $cache_key;

            # Expose cache status for testing
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }


    server {
        listen 80 default_server;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Cookie "";
            proxy_set_header Authorization "";

            # --- Caching ---
            proxy_cache grafana_cache;
            proxy_cache_methods GET HEAD POST;
            proxy_cache_valid 200 206 2s;   # only cache successful responses for 2s which is grafana's refresh rate
            proxy_cache_valid any 0;        # don't cache anything else
            proxy_ignore_headers Cache-Control;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            # Cache key: method + URI + query string + referer + body size
            # Body size differentiates POST payloads for different panels,
            # same trick as this article since we can't read POST body: https://makergeek.co.uk/caching-grafana-graphs-with-the-open-source-version/
            set $cache_key "$request_method$request_uri$http_referer$content_length";
            proxy_cache_key $cache_key;

            # Expose cache status for testing
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}