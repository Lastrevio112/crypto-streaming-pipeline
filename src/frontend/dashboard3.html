<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signal Analysis</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="sidebar">
    <sidebar-signal></sidebar-signal>
  </div>

  <div id="topbar">
    <custom-topbar-sliding-windows></custom-topbar-sliding-windows>
  </div>

  <!-- Right Sidebar -->
  <div id="messagelog" class="messagelog-closed">
    <div id="messagelog-header">
      <span class="messagelog-title">Live Feed</span>
      <button id="messagelog-close" aria-label="Close feed">✕</button>
    </div>
    <div id="message-feed">
      <!-- Messages will be injected here -->
    </div>
  </div>

  <div id="dashboard">
    <!-- Each chart goes under here: -->
    <div class="chart-wrapper">
      <div class="click-shield"></div>
      <iframe 
        src="http://localhost:3000/d-solo/adm42qh/signal-analysis-dashboard-sliding-windows?kiosk=true&orgId=1&timezone=browser&var-sliding_window=analytics_1m_sliding&var-coin_symbol=BTCUSDT&refresh=2s&theme=dark&panelId=panel-2" width="450" height="200" frameborder="0">
      </iframe>
      </div>
    
    <div class="chart-wrapper">
      <div class="click-shield"></div>
      <iframe
        src="http://localhost:3000/d-solo/adm42qh/signal-analysis-dashboard-sliding-windows?kiosk=true&orgId=1&timezone=browser&var-sliding_window=analytics_1m_sliding&var-coin_symbol=BTCUSDT&refresh=2s&theme=dark&panelId=panel-3" width="450" height="200" frameborder="0">
      </iframe>
    </div>
    
    <div class="chart-wrapper">
      <div class="click-shield"></div>
      <iframe 
        src="http://localhost:3000/d-solo/adm42qh/signal-analysis-dashboard-sliding-windows?kiosk=true&orgId=1&timezone=browser&var-sliding_window=analytics_1m_sliding&var-coin_symbol=BTCUSDT&refresh=2s&theme=dark&panelId=panel-4" width="450" height="200" frameborder="0">
      </iframe>
    </div>

    <div id="disclaimer">
      <custom-disclaimer></custom-disclaimer>
    </div>
  </div>

  <script src="Javascript/MessageLog.js"></script>
  <script src="Javascript/TopBar.js"></script>
  <script src="Javascript/SideBar.js"></script>
  <script src="Javascript/Disclaimer.js"></script>
  <script src="Javascript/SelectableFilters.js"></script>
</body>
</html>
